name: An idea
description: Something PresenterCraft should do to help run a service.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you need in your own words. Please don't paste screenshots or text from
        other presentation software: PresenterCraft is built from descriptions of what people
        need, not from other products.
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: What would you do during a service, a rehearsal or while preparing one?
      placeholder: Show the next song's title on the stage screen while the band plays the outro.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      placeholder: Our worship leader announces the next song and can't see the playlist.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another tool, or not at all.
