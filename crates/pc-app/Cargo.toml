[package]
name = "pc-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "presentercraft"
path = "src/main.rs"

[features]
# NDI output is part of the app. Building it needs the NDI SDK installed; see
# docs/licences/ndi.md. A computer without the SDK can still build the rest with
# `--no-default-features`.
default = ["ndi"]
ndi = ["pc-ndi/sdk"]

[dependencies]
pc-ndi.workspace = true
pc-bible.workspace = true
ureq.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
pc-model.workspace = true
pc-engine.workspace = true
pc-render.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
png.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[lints]
workspace = true
