[package]
name = "sp-video"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The sound of videos played through FFmpeg, and what ffprobe says of a video.
rodio.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-graphics"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2-core-foundation = "0.3"

# Calls into the system's media frameworks need `unsafe`; this crate alone allows it, and only
# in its macOS module. Every unsafe block says why it is sound.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
