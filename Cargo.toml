[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
pc-model = { path = "crates/pc-model" }
pc-engine = { path = "crates/pc-engine" }
pc-render = { path = "crates/pc-render" }
pc-ndi = { path = "crates/pc-ndi" }
pc-bible = { path = "crates/pc-bible" }
# Fetching Bibles: a small blocking HTTPS client, and the checksum each download is checked against.
ureq = "3"
sha2 = "0.10"
# Graphics crates change their APIs between releases: pinned exactly.
vello = "=0.12.0"
parley = "=0.13.0"
winit = "=0.30.13"
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui-wgpu = "=0.37.0"
egui-winit = "=0.37.0"
# The time on stage screens, in the computer's own time zone.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Moving a deleted song's file to the Trash rather than erasing it.
trash = "5"
# The macOS menu bar.
muda = { version = "=0.21.2", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "1"
png = "0.18"
# Decoding pictures dropped into the media bin.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
